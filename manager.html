(()=>{const $=x=>document.getElementById(x),KEY='kweider-manager-v32';let d,w,sel,el,rot=-90,scope='visible',ready=false;const pages=()=>w?[...w.children].filter(x=>x.classList.contains('page')):[];const st=t=>$('status').textContent=t;function fitStage(){let v=$('vp'),s=Math.min(v.clientWidth/1080,v.clientHeight/1920);$('stage').style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fitStage);function typeOf(p){return p.dataset.adminType||(p.querySelector('.offer-page-container,.cafe-text-box')?'ad':'product')}function title(p,i){return p.dataset.adminLabel||p.querySelector('.offer-title-en,.cafe-title-en,.en-title,.offer-title-ar,.ar-title,h1,h2')?.textContent.trim()||`الصفحة ${i+1}`}function meta(){pages().forEach((p,i)=>{p.dataset.uid||=(Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2));p.dataset.enabled||='true';p.dataset.adminType||=typeOf(p);p.dataset.adminLabel||=title(p,i)})}function only(p){pages().forEach(x=>{x.classList.remove('active');x.style.opacity='0';x.style.zIndex='1';x.style.pointerEvents='none'});p.classList.add('active');p.style.opacity='1';p.style.zIndex='10';p.style.pointerEvents='auto'}function choose(p){if(!p)return;sel=p;only(p);draw();sync();el=null;syncEl();mini()}function draw(){let A=$('ads'),P=$('prods');A.innerHTML=P.innerHTML='';let ac=0,pc=0;pages().forEach((p,i)=>{let t=typeOf(p),x=document.createElement('div');x.className=`item ${t}${p===sel?' sel':''}${p.dataset.enabled==='false'?' off':''}`;x.innerHTML=`<div class="num">${i+1}</div><div class="name">${title(p,i)}<div class="tag">${t==='ad'?'إعلان':'منتجات'}</div></div><div>${Math.round((+p.dataset.duration||7000)/1000)} ث</div>`;x.onclick=()=>choose(p);(t==='ad'?A:P).appendChild(x);t==='ad'?ac++:pc++});$('ac').textContent=ac;$('pc').textContent=pc}function sync(){if(!sel)return;let i=pages().indexOf(sel);$('label').value=title(sel,i);$('type').value=typeOf(sel);$('dur').value=Math.round((+sel.dataset.duration||7000)/1000);$('enabled').value=sel.dat ولا يوجد تشغيل تلقائي داخل المدير.')}function save(){localStorage.setItem(KEY,JSON.stringify({html:w.innerHTML,rot,scope,uid:sel?.dataset.uid}));st('تم الحفظ على هذا الجهاز.')}function restore(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s)return;if(s.html)w.innerHTML=s.html;meta();rot=Number.isFinite(+s.rot)?+s.rot:-90;scope=s.scope||'visible';sel=s.uid?pages().find(p=>p.dataset.uid===s.uid):null;$('rot').value=rot;$('scope').value=scope}catch{}}function move(n){if(!sel)return;let x=n<0?sel.previousElementSibling:sel.nextElementSibling;if(!x)return;n<0?w.insertBefore(sel,x):w.insertBefore(x,sel);draw();mini()}function dup(){if(!sel)return;let c=sel.cloneNode(true);c.dataset.uid=Date.now()+'_'+Math.random();c.dataset.adminLabel=sel.dataset.adminLabel+' - نسخة';sel.after(c);choose(c)}function del(){if(!sel||pages().length<2)return;if(!confirm('حذف الصفحة؟'))return;let n=sel.nextElementSibling||sel.previousElementSibling;sel.remove();choose(n)}function add(t){let p=d.createElement('div');p.className='page';p.dataset.duration='7000';p.dataset.enabled='true';p.dataset.adminType=t;p.dataset.uid=Date.now()+'_'+Math.random();p.dataset.adminLabel=t==='ad'?'إعلان جديد':'صفحة منتجات جديدة';p.innerHTML=t==='ad'?'<div class="offer-page-container" style="opacity:1"><div class="offer-image-wrapper"><img class="offer-image-giant" style="opacity:1"></div><h1 class="offer-title-ar" style="opacity:1">عنوان الإعلان بالعربية</h1><h2 class="offer-title-en" style="opacity:1">English advertisement title</h2></div>':'<div class="product-row"><img class="product-image"><div class="header-section"><h1 class="ar-title">اسم المنتج</h1><h2 class="en-title">Product Name</h2></div><div class="prices-container"><div class="price-tag"><span class="unit">1 piece</span>£0</div></div></div>';w.appendChild(p);choose(p)}function info(){return Math.abs(rot)===90?{w:1920,h:1080}:{w:1080,h:1920}}function match(p){let t=typeOf(p),v=p.dataset.enabled!=='false';return scope==='current'?p.data f(!h)return alert('لا توجد صفحات ضمن النطاق');let u=URL.createObjectURL(new Blob([h],{type:'text/html'}));open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}function exp(){let h=out(true);if(!h)return alert('لا توجد صفحات ضمن النطاق');let u=URL.createObjectURL(new Blob([h],{type:'text/html'})),a=document.createElement('a');a.href=u;a.download='KWEIDER_Hall_Menu.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('p-'+b.dataset.p).classList.add('on')});$('save').onclick=save;$('exp').onclick=exp;$('prev').onclick=preview;$('up').onclick=()=>move(-1);$('down').onclick=()=>move(1);$('dup').onclick=dup;$('del').onclick=del;$('addAd').onclick=()=>add('ad');$('addPr').onclick=()=>add('product');$('label').oninput=e=>{sel.dataset.adminLabel=e.target.value;draw()};$('type').onchange=e=>{sel.dataset.adminType=e.target.value;draw();mini()};$('dur').oninput=e=>{sel.dataset.duration=Math.max(1,+e.target.value||7)*1000;draw();mini()};$('enabled').onchange=e=>{sel.dataset.enabled=e.target.value;draw();mini()};$('txt').oninput=e=>{if(el&&el.tagName!=='IMG')el.textContent=e.target.value;mini()};$('fs').oninput=e=>{if(el)el.style.fontSize=(+e.target.value||16)+'px';mini()};$('color').oninput=e=>{if(el)el.style.color=e.target.value;mini()};$('align').onchange=e=>{if(el)el.style.textAlign=e.target.value;mini()};$('src').oninput=e=>{if(el?.tagName==='IMG')el.src=e.target.value;mini()};$('iw').oninput=e=>{if(el?.tagName==='IMG')el.style.width=(+e.target.value||100)+'px';mini()};$('ih').oninput=e=>{if(el?.tagName==='IMG')el.style.height=(+e.target.value||100)+'px';mini()};$('fit').onchange=e=>{if(el?.tagName==='IMG')el.style.objectFit=e.target.value;mini()};$('file').onchange=e=>{let f=e.target.files?.[0];if(!f||el?.tagName!=='IMG')return;let r=new FileReader;r.onload=()=>{el.src=r.result;mini()};r.readAsDataUR
